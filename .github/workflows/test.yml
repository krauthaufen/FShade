name: Test

on:
  workflow_call:
  push:
    paths:
      - 'src/**'
      - 'paket.lock'
      - 'global.json'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'paket.lock'
      - 'global.json'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            sln: src/FShade.sln
          - os: windows-latest
            sln: src\FShade.sln
          - os: macos-latest
            sln: src/FShade.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Dotnet
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache Paket
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            paket-files
          key: ${{ runner.os }}-paket-${{ hashFiles('paket.lock') }}
          restore-keys: |
            ${{ runner.os }}-paket-

      - name: Restore Tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet paket restore

      - name: Build
        run: dotnet build -c Release ${{ matrix.sln }}

      - name: Test
        run: dotnet test ${{ matrix.sln }} -c Release --no-build --nologo --logger:"console;verbosity=normal"
